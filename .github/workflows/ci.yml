name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.11 / Windows
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.19"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen --extra dev ruff check src tests scripts
      - name: Unit and MCP protocol tests
        run: uv run --frozen --extra dev pytest -m "not integration" -q
      - name: Compile guest helpers on Windows PowerShell 5.1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-guest.ps1
      - name: Build wheel and source distribution
        run: uv run --frozen --extra dev python -m build --no-isolation
